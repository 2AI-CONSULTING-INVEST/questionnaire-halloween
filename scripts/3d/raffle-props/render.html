<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const HB = (n) => `/KayKit_HalloweenBits_1.0_FREE/Assets/gltf/${n}.gltf`;
const SK = (n) => `/packs/skeletons/KayKit_Skeletons_1.1_FREE/${n}`;
const loader = new GLTFLoader();
const cache = new Map();
const load = (url) => {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url));
  return cache.get(url);
};
const lambert = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });

// ---------------------------------------------------------------------------
// Accessoires de l'inspecteur, construits en low-poly (couleurs plates, style KayKit).
// ---------------------------------------------------------------------------

/** Loupe : anneau de métal sombre, verre bleuté légèrement transparent, manche en bois. */
function makeLoupe(r = 0.26) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, r * 0.13, 8, 24), lambert("#2b2a33"));
  g.add(ring);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(r * 0.9, 24), lambert("#bfe3ff", { transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
  g.add(glass);
  const glint = new THREE.Mesh(new THREE.CircleGeometry(r * 0.22, 12), lambert("#ffffff", { transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
  glint.position.set(-r * 0.35, r * 0.35, 0.01);
  g.add(glint);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.12, r * 0.12, r * 0.35, 8), lambert("#2b2a33"));
  neck.position.y = -r - r * 0.17;
  g.add(neck);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.17, r * 0.2, r * 1.5, 8), lambert("#7a4a2a"));
  handle.position.y = -r - r * 0.35 - r * 0.75;
  g.add(handle);
  return g;
}

/** Téléphone : plaque sombre arrondie, écran clair (lumineux) avec trois lignes de « texte ». */
function makePhone(w = 0.3, h = 0.6) {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  const rr = 0.05;
  shape.moveTo(-w / 2 + rr, -h / 2);
  shape.lineTo(w / 2 - rr, -h / 2);
  shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + rr);
  shape.lineTo(w / 2, h / 2 - rr);
  shape.quadraticCurveTo(w / 2, h / 2, w / 2 - rr, h / 2);
  shape.lineTo(-w / 2 + rr, h / 2);
  shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - rr);
  shape.lineTo(-w / 2, -h / 2 + rr);
  shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + rr, -h / 2);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: false }), lambert("#1e1c26"));
  body.position.z = -0.04;
  g.add(body);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.84, h * 0.86), new THREE.MeshLambertMaterial({ color: "#fff4d6", emissive: "#ffd27a", emissiveIntensity: 0.55 }));
  screen.position.z = 0.003;
  g.add(screen);
  // Lignes du « numéro » et de l'« adresse ».
  [[0.26, 0.6], [0.1, 0.45], [-0.06, 0.55], [-0.22, 0.4]].forEach(([y, len]) => {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(w * len, h * 0.045), lambert("#2b2a33"));
    line.position.set(-w * 0.42 + (w * len) / 2, h * y, 0.006);
    g.add(line);
  });
  return g;
}

/** Enveloppe : papier crème, rabat plus sombre, cachet de cire rouge. */
function makeEnvelope(w = 0.52, h = 0.34) {
  const g = new THREE.Group();
  const paper = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), lambert("#f3e7c9"));
  g.add(paper);
  const flap = new THREE.Shape();
  flap.moveTo(-w / 2, h / 2);
  flap.lineTo(w / 2, h / 2);
  flap.lineTo(0, -h * 0.08);
  flap.lineTo(-w / 2, h / 2);
  const flapMesh = new THREE.Mesh(new THREE.ShapeGeometry(flap), lambert("#e2d2ad"));
  flapMesh.position.z = 0.017;
  g.add(flapMesh);
  const seal = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.14, h * 0.14, 0.02, 10), lambert("#c0392b"));
  seal.rotation.x = Math.PI / 2;
  seal.position.set(0, -h * 0.02, 0.028);
  g.add(seal);
  return g;
}

// ---------------------------------------------------------------------------
// Jeux de rendu.
// ---------------------------------------------------------------------------

const SETS = {
  // Squelette KayKit (Minion) qui inspecte un téléphone à la loupe, une enveloppe dans l'autre main.
  inspector: {
    w: 440, h: 600, dir: [0.32, 0.18, 1], fov: 22, pad: 1.04,
    async build(group) {
      const [gltf, rig] = await Promise.all([load(SK("characters/gltf/Skeleton_Minion.glb")), load(SK("Animations/gltf/Rig_Medium/Rig_Medium_General.glb"))]);
      const model = gltf.scene;
      model.traverse((o) => {
        if (!o.isMesh) return;
        const src = o.material;
        o.material = /Eyes/i.test(o.name)
          ? new THREE.MeshBasicMaterial({ color: "#ffc93c" })
          : new THREE.MeshLambertMaterial({ map: src.map });
        o.frustumCulled = false;
      });
      group.add(model);
      // Base : pose « Idle_A » du rig commun (bras le long du corps), figée.
      const mixer = new THREE.AnimationMixer(model);
      const clip = rig.animations.find((a) => a.name === "Idle_A");
      if (clip) {
        const a = mixer.clipAction(clip);
        a.play();
        mixer.update(0.35);
      }
      // GLTFLoader retire les points des noms de nœuds (« handslot.l » → « handslotl »).
      const bone = (n) => model.getObjectByName(n) ?? model.getObjectByName(n.replace(/[.]/g, ""));
      // Oriente un os (axe local +Y, vers son enfant) vers un point du monde.
      const aim = (b, target) => {
        b.updateWorldMatrix(true, false);
        const pos = b.getWorldPosition(new THREE.Vector3());
        const yW = new THREE.Vector3(0, 1, 0).applyQuaternion(b.getWorldQuaternion(new THREE.Quaternion())).normalize();
        const d = target.clone().sub(pos).normalize();
        const q = new THREE.Quaternion().setFromUnitVectors(yW, d);
        const pq = b.parent.getWorldQuaternion(new THREE.Quaternion());
        b.quaternion.premultiply(pq.clone().invert().multiply(q).multiply(pq));
        b.updateWorldMatrix(true, true);
      };
      // Bras à deux os : épaule → coude (vers un pôle) → main sur la cible.
      const arm = (side, target, pole) => {
        const up = bone("upperarm." + side), low = bone("lowerarm." + side);
        const S = up.getWorldPosition(new THREE.Vector3());
        const L1 = low.position.length();
        const half = Math.min(L1 * 0.95, target.distanceTo(S) / 2);
        const mid = S.clone().lerp(target, 0.5).addScaledVector(pole, Math.sqrt(Math.max(0, L1 * L1 - half * half)));
        aim(up, mid);
        aim(low, target);
      };
      const P = window.POSE ?? {};
      // Loupe devant l'orbite gauche (à droite de l'image), téléphone dans l'autre main, devant la
      // poitrine ; les accessoires sont posés dans le monde, les mains viennent les tenir.
      const loupe = makeLoupe(0.3);
      const loupeAt = new THREE.Vector3(...(P.loupeAt ?? [0.3, 1.52, 0.78]));
      loupe.position.copy(loupeAt);
      loupe.rotation.set(...(P.loupeRot ?? [0.1, 0.35, 0.15]));
      group.add(loupe);
      const handL = loupeAt.clone().add(new THREE.Vector3(...(P.handL ?? [0.05, -0.62, -0.05])));
      arm("l", handL, new THREE.Vector3(...(P.poleL ?? [0.9, -0.3, -0.2])).normalize());
      const phone = makePhone(0.34, 0.62);
      const phoneAt = new THREE.Vector3(...(P.phoneAt ?? [-0.42, 1.2, 0.7]));
      phone.position.copy(phoneAt);
      phone.rotation.set(...(P.phoneRot ?? [-0.35, 0.25, 0.1]));
      group.add(phone);
      const env = makeEnvelope();
      env.position.set(...(P.envAt ?? [-0.72, 0.98, 0.56]));
      env.rotation.set(...(P.envRot ?? [-0.2, 0.55, -0.55]));
      group.add(env);
      const handR = phoneAt.clone().add(new THREE.Vector3(...(P.handR ?? [0.02, -0.3, -0.06])));
      arm("r", handR, new THREE.Vector3(...(P.poleR ?? [-0.9, -0.4, -0.2])).normalize());
      const head = bone("head");
      const hr = P.head ?? [0.28, 0.32, 0.12];
      head.rotation.set(head.rotation.x + hr[0], head.rotation.y + hr[1], head.rotation.z + hr[2]);
      model.updateMatrixWorld(true);
      const eye = model.getObjectByName("Skeleton_Minion_Eyes");
      const c = eye ? new THREE.Box3().setFromObject(eye).getCenter(new THREE.Vector3()) : new THREE.Vector3(0, 1.64, 0.26);
      return { eyes: c, screen: phoneAt };
    },
    lights: [[0.6, 1.5, 1.2, 1.6, "#ffb347"], [-0.8, 1.0, 0.9, 1.0, "#ffd9a0"]],
  },
  // Grappe de citrouilles-lanternes et bougies (coin bas-gauche de la modale).
  pumpkins: {
    w: 520, h: 400, dir: [-0.25, 0.42, 1], fov: 22, pad: 1.03,
    items: [
      [HB("pumpkin_orange_jackolantern"), 0, 0, 0.35, 1.0],
      [HB("pumpkin_yellow_small"), 0.85, 0.35, -0.4, 0.8],
      [HB("candle_triple"), -0.85, 0.3, 0.2, 0.9],
      [HB("skull"), 0.75, -0.55, -0.7, 0.55],
      [HB("bone_A"), -0.3, 0.75, 0.9, 0.7],
    ],
    lights: [[0, 0.62, 0.15, 4, "#ff8a2a"], [-0.85, 1.1, 0.3, 2.5, "#ffb347"]],
    // Découpes allumées de la citrouille (cellule « charcoal » de l'atlas), comme sur le site.
    jack: { pos: [0, 0.62, 0.15] },
  },
  // Lanterne suspendue à sa chaîne (coin haut-droit de la modale).
  lantern: {
    w: 220, h: 420, dir: [0.35, 0.05, 1], fov: 18, pad: 1.02,
    items: [[HB("lantern_hanging"), 0, 0, 0.4, 1]],
    lights: [[0, 0.55, 0.3, 3, "#ffb347"]],
    glass: true,
  },
};
window.SETS = SETS;

/** Découpes / vitres émissives : même recette que le site (cellule de l'atlas → lueur orange). */
function glowMaterial(map, cell, color) {
  const m = new THREE.MeshLambertMaterial({ map });
  m.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <emissivemap_fragment>",
      `#include <emissivemap_fragment>
      {
        vec2 uv = vMapUv;
        float cut = step(${cell[0]}, uv.x) * step(uv.x, ${cell[1]}) * step(${cell[2]}, uv.y) * step(uv.y, ${cell[3]});
        float facing = clamp(abs(dot(normal, normalize(vViewPosition))), 0.0, 1.0);
        totalEmissiveRadiance += mix(vec3(${color[0]}), vec3(${color[1]}), facing * facing) * cut * 2.0;
      }`,
    ).replace("#include <colorspace_fragment>", `float mx = max(gl_FragColor.r, max(gl_FragColor.g, gl_FragColor.b)); if (mx > 1.0) gl_FragColor.rgb /= mx;
      #include <colorspace_fragment>`);
  };
  return m;
}
const JACK_CELL = ["0.125", "0.25", "0.0", "0.25"];
const JACK_COL = ["0.3, 0.03, 0.001", "1.0, 0.22, 0.006"];
const GLASS_CELL = ["0.25", "0.375", "0.75", "1.0"];
const GLASS_COL = ["0.6, 0.12, 0.005", "1.0, 0.42, 0.04"];

window.renderSet = async (key) => {
  const set = SETS[key];
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(2);
  renderer.setSize(set.w, set.h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  document.body.innerHTML = "";
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  // Éclairage neutre-chaud : lisible sur la modale de nuit comme de jour.
  scene.add(new THREE.HemisphereLight("#cfc6e8", "#3a2a24", 1.35));
  const key1 = new THREE.DirectionalLight("#fff1dc", 1.1);
  key1.position.set(-3, 6, 5);
  scene.add(key1);
  const rim = new THREE.DirectionalLight("#ff9a3c", 0.55);
  rim.position.set(4, 2, -3);
  scene.add(rim);
  const group = new THREE.Group();
  scene.add(group);
  let extra = {};
  if (set.build) extra = (await set.build(group)) ?? {};
  for (const [url, x, z, ry, s] of set.items ?? []) {
    const gltf = await load(url);
    const m = gltf.scene.clone(true);
    const name = url.split("/").pop().replace(".gltf", "");
    m.traverse((o) => {
      if (!o.isMesh) return;
      const map = o.material.map;
      if (set.jack && /jackolantern/.test(name)) o.material = glowMaterial(map, JACK_CELL, JACK_COL);
      else if (set.glass && /lantern/.test(name)) o.material = glowMaterial(map, GLASS_CELL, GLASS_COL);
      else o.material = new THREE.MeshLambertMaterial({ map });
    });
    m.position.set(x, 0, z);
    m.rotation.y = ry;
    m.scale.setScalar(s);
    group.add(m);
  }
  for (const [x, y, z, i, c] of set.lights) {
    const l = new THREE.PointLight(c, i, 4, 1.6);
    l.position.set(x, y, z);
    scene.add(l);
  }
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const camera = new THREE.PerspectiveCamera(set.fov, set.w / set.h, 0.1, 200);
  const dir = new THREE.Vector3(...set.dir).normalize();
  const t = Math.tan(THREE.MathUtils.degToRad(set.fov / 2));
  const fit = Math.max(size.y / (2 * t), size.x / (2 * t * camera.aspect), size.z / (2 * t * camera.aspect));
  camera.position.copy(center).addScaledVector(dir, fit * (set.pad ?? 1.08) + Math.max(size.x, size.z) / 2);
  camera.lookAt(center);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  const px = (v) => {
    const p = v.clone().project(camera);
    return [((p.x + 1) / 2) * set.w, ((1 - p.y) / 2) * set.h];
  };
  const out = {};
  for (const [k, v] of Object.entries(extra)) if (v?.isVector3) out[k] = px(v);
  if (set.jack) out.flame = px(new THREE.Vector3(...set.jack.pos));
  return out;
};
window.ready = true;
</script>
</body>
</html>
