<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const HB = (n) => `/KayKit_HalloweenBits_1.0_FREE/Assets/gltf/${n}.gltf`;
const FN = (n) => `/packs/Forest_Nature_Pack_1.0/KayKit_Forest_Nature_Pack_1.0_FREE/Assets/gltf/${n}.gltf`;
const loader = new GLTFLoader();
const cache = new Map();
const load = (url) => {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url));
  return cache.get(url);
};

// Motte de terre : dôme bas et large, facettes low-poly (style KayKit), plus clair en haut.
const MOUND = { w: 12, d: 4.6, h: 1.9 };
const shape = (r) => (r >= 1 ? 0 : Math.pow(Math.cos((r * Math.PI) / 2), 0.85));
const moundY = (x, z) => MOUND.h * shape(Math.hypot(x / (MOUND.w / 2), z / (MOUND.d / 2)));
function moundMesh() {
  // Dôme elliptique (profil tourné) : silhouette arrondie, facettes irrégulières.
  const prof = [];
  for (let i = 0; i <= 12; i++) prof.push(new THREE.Vector2(i / 12, shape(i / 12)));
  const geo = new THREE.LatheGeometry(prof.reverse(), 48);
  const p = geo.attributes.position;
  // Relief déterministe selon la position : les sommets doublés de la couture reçoivent le même décalage.
  const hash = (x, z, k) => {
    const v = Math.sin(Math.round(x * 1000) * 12.9898 + Math.round(z * 1000) * 78.233 + k * 37.719) * 43758.5453;
    return v - Math.floor(v) - 0.5;
  };
  for (let i = 0; i < p.count; i++) {
    const ux = p.getX(i), uz = p.getZ(i);
    const x = ux * (MOUND.w / 2), z = uz * (MOUND.d / 2);
    const y = p.getY(i) * MOUND.h;
    const edge = y > 0.01 ? 1 : 0;
    p.setXYZ(i, x + hash(ux, uz, 1) * 0.14 * edge, y + hash(ux, uz, 2) * 0.12 * edge, z + hash(ux, uz, 3) * 0.14 * edge);
  }
  const g = geo.toNonIndexed();
  g.computeVertexNormals();
  const top = new THREE.Color("#6a4b37"), bottom = new THREE.Color("#241711"), c = new THREE.Color();
  const col = new Float32Array(g.attributes.position.count * 3);
  for (let i = 0; i < g.attributes.position.count; i++) {
    c.copy(bottom).lerp(top, Math.min(1, Math.max(0, g.attributes.position.getY(i) / MOUND.h)));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
}

const SETS = {
  mound: {
    w: 1600, h: 640, dir: [0, 0.3, 1], fov: 22,
    items: [
      [HB("gravestone"), -4.3, -0.7, 0.35, 1.05],
      [HB("candle"), -3.45, 0.15, 0, 0.8],
      [HB("candle_thin"), -3.15, -0.2, 0, 0.8],
      [HB("pumpkin_orange_jackolantern"), -2.35, 0.55, 0.45, 1.0],
      [HB("pumpkin_yellow_small"), -1.45, 1.05, 0.5, 0.85],
      [HB("bone_A"), -0.55, 1.4, 0.8, 0.9],
      [HB("skull"), 0.35, 1.45, -0.35, 0.6],
      [HB("bone_B"), 1.05, 1.3, -0.5, 0.8],
      [HB("candle_melted"), 1.85, 0.95, 0, 0.9],
      [HB("skull_candle"), 2.6, 0.55, -0.4, 1.0],
      [HB("pumpkin_yellow_jackolantern"), 4.05, 0.35, -0.55, 1.0],
      [HB("candle_triple"), 4.95, -0.45, 0.2, 0.9],
      [HB("pumpkin_orange_small"), 5.3, 0.55, 1, 0.75],
      [FN("Grass_1_A_Color1"), -5.0, 0.6, 0.3, 1.1, "#4a5642"],
      [FN("Grass_2_B_Color1"), -1.0, 0.2, 1.1, 1.0, "#4a5642"],
      [FN("Grass_1_A_Color1"), 3.3, -0.4, 2.1, 0.9, "#4a5642"],
      [FN("Rock_1_A_Color1"), -0.2, -1.1, 0.7, 0.55, "#7d7690"],
      [FN("Rock_3_A_Color1"), 5.4, -0.9, 0.4, 0.6, "#7d7690"],
    ],
    lights: [[-2.35, 0.9, 0.7, 5, "#ff8a2a"], [4.05, 0.9, 0.5, 5, "#ff9a3c"], [-3.3, 1.4, 0.2, 2.5, "#ffb347"], [1.85, 1.6, 1.0, 2.5, "#ffb347"], [2.6, 1.7, 0.6, 2.5, "#ffb347"]],
    mound: true,
  },
  // Poteau-lanterne vu de profil : le bras porte la lanterne vers la gauche (vers le panneau).
  // stretch : le mât (sous la jambe de force) est allongé d'autant, la lanterne et le bras restent intacts.
  // split : « post » sans la lanterne, « lamp » la lanterne seule (même cadrage) ; elle est posée à
  // part dans la page pour pouvoir se balancer au bout de sa chaîne.
  post: { w: 460, h: 2000, dir: [1, 0.12, 0.3], fov: 20, items: [[HB("post_lantern"), 0, 0, 0, 1]], lights: [[0, 2.45, 1.15, 5, "#ffb347"]], stretch: 4.6, split: "post" },
};
SETS.lamp = { ...SETS.post, split: "lamp" };

window.renderSet = async (key) => {
  const set = SETS[key];
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(2);
  renderer.setSize(set.w, set.h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  document.body.innerHTML = "";
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight("#8f7cc0", "#2a1a12", 1.25));
  const moon = new THREE.DirectionalLight("#c9c2ff", 1.0);
  moon.position.set(-4, 7, 5);
  scene.add(moon);
  const rim = new THREE.DirectionalLight("#ff9a3c", 0.7);
  rim.position.set(5, 2, -3);
  scene.add(rim);
  const group = new THREE.Group();
  scene.add(group);
  if (set.mound) group.add(moundMesh());
  for (const [url, x, z, ry, s, tint] of set.items) {
    const gltf = await load(url);
    const m = gltf.scene.clone(true);
    m.traverse((o) => {
      if (o.isMesh) o.material = new THREE.MeshLambertMaterial({ map: o.material.map, color: tint ?? "#ffffff" });
    });
    if (set.stretch) {
      // Allonge le mât : tout ce qui est sous yCut est étiré, le haut (bras + lanterne) est remonté.
      m.updateMatrixWorld(true);
      const b0 = new THREE.Box3().setFromObject(m);
      const yCut = b0.min.y + (b0.max.y - b0.min.y) * 0.42;
      m.traverse((o) => {
        if (!o.isMesh) return;
        o.geometry = o.geometry.clone();
        const inv = o.matrixWorld.clone().invert();
        const pa = o.geometry.attributes.position;
        const v = new THREE.Vector3();
        for (let i = 0; i < pa.count; i++) {
          v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld);
          v.y = v.y < yCut ? v.y * set.stretch : v.y + yCut * (set.stretch - 1);
          v.applyMatrix4(inv);
          pa.setXYZ(i, v.x, v.y, v.z);
        }
        pa.needsUpdate = true;
        o.geometry.computeBoundingBox();
        o.geometry.computeBoundingSphere();
      });
      // Lanterne : sommets éloignés du mât (z > 0,7) et sous le bras.
      m.updateMatrixWorld(true);
      const lb = new THREE.Box3();
      m.traverse((o) => {
        if (!o.isMesh) return;
        const pa = o.geometry.attributes.position;
        const v = new THREE.Vector3();
        for (let i = 0; i < pa.count; i++) {
          v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld);
          if (v.z > 0.7) lb.expandByPoint(v);
        }
      });
      set.lampBox = lb;
      if (set.split) {
        // Garde les pièces de la lanterne (chaîne comprise : centre à z > 0,7, sous le bout du bras
        // qui occupe le haut de lampBox) ou celles du poteau ; les triangles des autres sont aplatis
        // (les positions ne bougent pas : le cadrage reste le même pour les deux rendus). Le tri se
        // fait par pièce connexe (sommets confondus), pour ne pas couper un maillon en deux.
        const armBottom = lb.max.y - (lb.max.y - lb.min.y) * 0.17;
        m.traverse((o) => {
          if (!o.isMesh) return;
          if (!o.geometry.index) o.geometry = o.geometry.toNonIndexed().setIndex([...Array(o.geometry.attributes.position.count).keys()]);
          const pa = o.geometry.attributes.position;
          const idx = o.geometry.index;
          const v = new THREE.Vector3();
          const world = Array.from({ length: pa.count }, (_, i) => v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld).clone());
          const parent = world.map((_, i) => i);
          const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
          const join = (i, j) => (parent[find(i)] = find(j));
          const byPos = new Map();
          world.forEach((p, i) => {
            const key = p.toArray().map((c) => Math.round(c * 1e4)).join(",");
            if (byPos.has(key)) join(i, byPos.get(key));
            else byPos.set(key, i);
          });
          for (let t = 0; t < idx.count; t += 3) join(idx.getX(t), idx.getX(t + 1)), join(idx.getX(t), idx.getX(t + 2));
          const sums = new Map();
          world.forEach((p, i) => {
            const r = find(i);
            const s = sums.get(r) ?? { c: new THREE.Vector3(), n: 0 };
            s.c.add(p);
            s.n++;
            sums.set(r, s);
          });
          const isLamp = (i) => {
            const s = sums.get(find(i));
            const c = s.c.clone().divideScalar(s.n);
            return c.z > 0.7 && c.y < armBottom;
          };
          for (let t = 0; t < idx.count; t += 3) {
            if (isLamp(idx.getX(t)) !== (set.split === "lamp")) idx.setXYZ(t, idx.getX(t), idx.getX(t), idx.getX(t));
          }
          idx.needsUpdate = true;
        });
      }
    }
    m.position.set(x, set.mound ? moundY(x, z) - 0.04 : 0, z);
    m.rotation.y = ry;
    m.scale.setScalar(s);
    group.add(m);
  }
  for (const [x, y, z, i, c] of set.lights) {
    const l = new THREE.PointLight(c, i, 4, 1.6);
    l.position.set(x, set.mound ? moundY(x, z) + y : set.lampBox ? set.lampBox.getCenter(new THREE.Vector3()).y : y, z);
    scene.add(l);
  }
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const camera = new THREE.PerspectiveCamera(set.fov, set.w / set.h, 0.1, 200);
  const dir = new THREE.Vector3(...set.dir).normalize();
  const t = Math.tan(THREE.MathUtils.degToRad(set.fov / 2));
  const fit = Math.max(size.y / (2 * t), size.x / (2 * t * camera.aspect), size.z / (2 * t * camera.aspect));
  camera.position.copy(center).addScaledVector(dir, fit * 1.08 + Math.max(size.x, size.z) / 2);
  camera.lookAt(center);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  // Position (en pixels du rendu) de points utiles : la flamme de la lanterne, le sommet de la motte au centre.
  const px = (v) => {
    const p = v.clone().project(camera);
    return [((p.x + 1) / 2) * set.w, ((1 - p.y) / 2) * set.h];
  };
  const out = {};
  if (set.lampBox) {
    const c = set.lampBox.getCenter(new THREE.Vector3());
    out.lampCenter = px(c);
    out.lampBottom = px(new THREE.Vector3(c.x, set.lampBox.min.y, c.z));
    out.lampTop = px(new THREE.Vector3(c.x, set.lampBox.max.y, c.z));
    out.poleBase = px(new THREE.Vector3(0, 0, 0));
  }
  if (set.lamp) out.lamp = px(new THREE.Vector3(...set.lamp));
  if (set.mound) {
    out.ridgeCenter = px(new THREE.Vector3(0, moundY(0, 0), 0));
    out.ridgeBack = px(new THREE.Vector3(0, moundY(0, -0.8), -0.8));
    out.base = px(new THREE.Vector3(0, 0, 0));
  }
  return out;
};
window.ready = true;
</script>
</body>
</html>
