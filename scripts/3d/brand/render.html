<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

// Badge rond Chamas Tacos (version Halloween, pack logos.glb), vu de face, fond transparent.
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync("/public/3d/logos.glb");

window.render = (size) => window.renderObject("chamastacos_badge_halloween", size, size);

/** Rendu d'un objet du pack (badge, logo long « wordmark »), cadré dans w × h, fond transparent. */
window.renderObject = (name, w, h) => {
  const badge = gltf.scene.getObjectByName(name);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  document.body.innerHTML = "";
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const m = badge.clone(true);
  m.position.set(0, 0, 0);
  m.rotation.set(0, 0, 0);
  m.scale.setScalar(1);
  m.traverse((o) => {
    if (o.isMesh) o.material = new THREE.MeshLambertMaterial({ map: o.material.map, color: o.material.color });
  });
  scene.add(m);
  // Lumière franche (le logo doit rester lisible en tout petit), léger contre-jour orangé.
  scene.add(new THREE.HemisphereLight("#fff1e0", "#3a2f48", 1.25));
  const key = new THREE.DirectionalLight("#ffffff", 1.2);
  key.position.set(-2, 3, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight("#ffa040", 0.8);
  rim.position.set(4, 1, -3);
  scene.add(rim);
  const box = new THREE.Box3().setFromObject(m);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const fov = 18;
  const camera = new THREE.PerspectiveCamera(fov, w / h, 0.1, 500);
  const t = Math.tan(THREE.MathUtils.degToRad(fov / 2));
  const d = (Math.max(s.x / (w / h), s.y) / 2 / t) * 1.04 + s.z / 2;
  camera.position.set(c.x, c.y + s.y * 0.02, c.z + d);
  camera.lookAt(c);
  renderer.render(scene, camera);
  return { size: s.toArray() };
};
window.ready = true;
</script>
</body>
</html>
