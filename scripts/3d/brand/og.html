<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0c0a12; font-family: Inter, "Segoe UI", sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(1.3) saturate(1.1); }
  /* Fond assombri à gauche pour le texte, vignette sur les bords. */
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(12,10,18,0.97) 0%, rgba(12,10,18,0.93) 44%, rgba(12,10,18,0.35) 70%, rgba(12,10,18,0.05) 100%),
    radial-gradient(120% 90% at 70% 40%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  .content { position: absolute; left: 64px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 118px; height: 118px; filter: drop-shadow(0 8px 22px rgba(0,0,0,0.6)) drop-shadow(0 0 26px rgba(255,140,40,0.25)); }
  .kicker { font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ff9a3c; }
  .kicker b { display: block; color: #f5f0ff; letter-spacing: 0.06em; font-size: 30px; font-weight: 900; margin-top: 4px; }
  h1 { margin: 0; font-size: 60px; line-height: 1.04; font-weight: 900; color: #fff; letter-spacing: -0.02em; text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
  h1 em { font-style: normal; color: #f5c542; }
  p { margin: 0; font-size: 25px; line-height: 1.38; font-weight: 500; color: #d9d2ea; max-width: 600px; }
  .cta { align-self: flex-start; margin-top: 6px; padding: 14px 28px; border-radius: 999px; background: #f5c542; color: #1a1206; font-size: 24px; font-weight: 900; box-shadow: 0 10px 30px rgba(245,197,66,0.3); }
  .live { display: inline-flex; align-items: center; gap: 10px; }
  .live::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 0 6px rgba(255,59,59,0.25); }
</style>
</head>
<body>
<div class="card">
  <img class="bg" id="bg" alt="" />
  <div class="shade"></div>
  <div class="content">
    <div class="brand">
      <img src="badge.png" alt="" />
      <div class="kicker" id="kicker"></div>
    </div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="cta" id="cta"></div>
  </div>
</div>
<script>
  // Rempli par og.mjs : window.fill({ bg, kicker, title, text, cta }) (HTML de confiance, écrit dans le script).
  window.fill = async (o) => {
    for (const k of ["kicker", "title", "text", "cta"]) document.getElementById(k).innerHTML = o[k];
    const bg = document.getElementById("bg");
    bg.src = o.bg;
    await bg.decode();
    await document.fonts.ready;
  };
</script>
</body>
</html>
